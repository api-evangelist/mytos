name: Mytos
description: >-
  Mytos is a contract development and manufacturing organization (CDMO) for
  regenerative medicine and cell therapy. Its iDEM automation platform automates
  every unit operation of cell culture — coating, seeding, feeding, imaging,
  passaging and harvesting — in standard 2D T-flask formats, letting
  clinical-stage biotech companies transfer their manual protocols to automated
  GMP production at up to 50% lower batch cost, with 10x less labor and cleanroom
  footprint per batch. Mytos operates a CDMO facility within the Cell and Gene
  Therapy Catapult site and is backed by Wing Venture Capital. No public
  developer/API surface was found during enrichment; the profile captures the
  company's verified security posture (trust center, SOC 2/SOC 3/21 CFR Part 11,
  domain security, vulnerability disclosure).
